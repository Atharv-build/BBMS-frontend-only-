<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Dashboard - Life Care</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body id="donor_dashboard">
    <div>
        <header class="header">
            <div class="container">
                <div class="logo-area">
                    <button class="hamburger-btn" id="hamburger-btn" onclick="toggleHamburgerMenu()" aria-label="Menu">
                        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <div class="logo">
                        <div style="font-size: 1.5rem; font-weight: 700; color: var(--primary-color);">Donor Portal</div>
                    </div>
                    <!-- Portal Switcher Menu -->
                    <div class="hamburger-menu" id="hamburger-menu">
                        <a href="index.html" class="hamburger-menu-item">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>
                            Home
                        </a>
                        <a href="patient_login.html" class="hamburger-menu-item">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                            Patient Portal
                        </a>
                        <a href="donor_login.html" class="hamburger-menu-item active">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                            Donor Portal
                        </a>
                        <a href="user_login.html" class="hamburger-menu-item">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                            User Portal
                        </a>
                    </div>
                </div>
                <div><button class="btn btn-primary" onclick="logout()">Logout</button></div>
            </div>
        </header>
        <main class="section">
            <div class="container">
                 <h1 id="donor-welcome-message" class="section-title" style="text-align:left;">Welcome!</h1>
                 <div style="display:grid; grid-template-columns: 1fr; gap: 2rem;">
                    <div>
                         <div class="card">
                            <div class="card-header">Schedule a Donation</div>
                            <div class="card-body">
                                <form id="donor-appointment-form" onsubmit="handleAppointmentSubmit(event)">
                                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                        <input name="date" type="date" class="form-input" required>
                                        <select name="location" class="form-input" required>
                                            <option value="">Select Location</option>
                                            <option value="Downtown Plaza">Downtown Plaza</option>
                                            <option value="Greenwood Park">Greenwood Park</option>
                                            <option value="Central Hospital">Central Hospital</option>
                                        </select>
                                    </div>
                                    <button type="submit" class="btn btn-primary" style="margin-top:1rem;">Book Appointment</button>
                                </form>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-header">My Appointments</div>
                            <div class="card-body"><div class="table-container"><div id="donor-appointments-table"></div></div></div>
                        </div>
                        <div class="card">
                            <div class="card-header">My Donation History</div>
                            <div class="card-body"><div class="table-container"><div id="donor-history-table"></div></div></div>
                        </div>
                    </div>
                    <div>
                        <div class="card">
                            <div class="card-header">Health Information</div>
                            <div class="card-body" id="donor-health-info" style="display:flex; flex-direction:column; gap:1rem;"></div>
                        </div>
                        <div class="card">
                            <div class="card-header">Upcoming Donation Camps</div>
                            <div class="card-body"><div class="table-container"><div id="donor-campaigns-table"></div></div></div>
                        </div>
                    </div>
                 </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
